name: SDRPlusPlus
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.sdrppbrown.app
    TARGETED_DEVICE_FAMILY: "2"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  SDRPlusPlus:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SDR++ by AJA
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Connects to the SDR++ server on your network.
    settings:
      base:
        PRODUCT_NAME: SDR++ by AJA
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Stage/Frameworks
        OTHER_LDFLAGS: -lsdrpp_core
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
    postCompileScripts:
      - name: Embed SDR++ libraries
        script: |
          set -e
          APP="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH"
          mkdir -p "$APP/Frameworks"
          cp "$SRCROOT"/Stage/Frameworks/*.dylib "$APP/Frameworks/"
          rm -rf "$APP/res"
          cp -R "$SRCROOT/Stage/res" "$APP/res"
          for f in "$APP"/Frameworks/*.dylib; do
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$f"
          done
